[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/pdf-syntax", "crates/pdf-worker"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pdf-syntax = { path = "crates/pdf-syntax" }
pdf-worker = { path = "crates/pdf-worker" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
