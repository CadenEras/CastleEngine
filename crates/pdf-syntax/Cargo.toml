[package]
name = "pdf-syntax"
description = "PDF syntax: tokenizer, objects, input sources and shared resource budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Flate decoding (ADR-0003): no unsafe code, MIT OR Zlib OR Apache-2.0.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
# Property tests (ADR-0002); test-only, MIT OR Apache-2.0.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
