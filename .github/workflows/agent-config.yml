name: agent-config
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; update by reviewed PR
        with:
          persist-credentials: false
      # Hosted runners provide Node. The validator rejects Node < 22 explicitly.
      # Pin the runtime and runner versions alongside the product toolchains in P0.
      - name: Check runtime
        run: node --version
      - name: Validate configuration
        run: node scripts/validate-agent-kit.mjs
      - name: Exercise hooks
        run: node --test scripts/tests/hooks.test.mjs
