name: advisories
# RustSec advisories change independently of our code. A new advisory must be
# seen quickly but must not block unrelated pull requests, so this workflow is
# not a required check: it runs weekly, on main and when dependencies change.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/advisories.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1; update by reviewed PR
        with:
          command: check advisories
